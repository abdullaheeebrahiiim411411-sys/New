name: Repair stale status display once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: runtime
    steps:
      - run: python -m pip install --disable-pip-version-check --no-cache-dir psycopg2-binary
      - name: Repair status fields only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg2
          c=psycopg2.connect(os.environ['DATABASE_URL'],connect_timeout=20,sslmode='require')
          with c:
            with c.cursor() as x:
              x.execute("""UPDATE system_status SET
                  status='IDLE',
                  last_check_end=now(),
                  scan_duration=0,
                  next_check=now(),
                  updated_at=now()
                WHERE id=1""")
              if x.rowcount != 1: raise SystemExit('status_row_not_updated')
              print('status_display_repaired=true')
          PY
