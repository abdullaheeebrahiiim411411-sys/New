name: Reuse Amazon confirmation sessions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reuse-amazon-confirmation-sessions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Patch, validate, and publish encrypted runtime
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          work="$RUNNER_TEMP/reuse-amazon-confirmation-sessions"
          mkdir -p "$work/payload"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$work/payload.tgz" .assets/node.dat
          tar -xzf "$work/payload.tgz" -C "$work/payload"
          PAYLOAD_DIR="$work/payload" python .assets/apply_require_amazon_al_ahsa_location.py
          PAYLOAD_DIR="$work/payload" python .assets/apply_add_due_routine_wakeup.py
          PAYLOAD_DIR="$work/payload" python .assets/apply_discover_amazon_al_ahsa_local_catalog.py
          PAYLOAD_DIR="$work/payload" python .assets/apply_use_amazon_riyadh_context.py
          PAYLOAD_DIR="$work/payload" python .assets/apply_reuse_amazon_confirmation_sessions.py
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$work/payload/requirements.txt"
          cp .assets/validate_add_due_routine_wakeup.py "$work/"
          cp .assets/validate_use_amazon_riyadh_context.py "$work/"
          cp .assets/validate_reuse_amazon_confirmation_sessions.py "$work/"
          cd "$work/payload"
          python -m py_compile webhook.py control.py scanner.py
          PAYLOAD_DIR="$work/payload" python "$work/validate_add_due_routine_wakeup.py"
          PAYLOAD_DIR="$work/payload" python "$work/validate_use_amazon_riyadh_context.py"
          PAYLOAD_DIR="$work/payload" python "$work/validate_reuse_amazon_confirmation_sessions.py"
          tar -czf "$work/updated.tgz" -C "$work/payload" .
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$GITHUB_WORKSPACE/.assets/node.dat" "$work/updated.tgz"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'runtime-publisher'
          git config user.email 'runtime-publisher@users.noreply.github.com'
          git add .assets/node.dat
          git commit -m 'Reuse Amazon confirmation sessions'
          git push

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/reuse-amazon-confirmation-sessions"
