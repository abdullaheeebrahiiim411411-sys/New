name: Request full scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install database driver
        run: python -m pip install --disable-pip-version-check --no-cache-dir psycopg2-binary
      - name: Record owner full-scan request
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .assets/request_full_scan.py
