name: Recover cancelled scan lease

on:
  workflow_dispatch:
    inputs:
      expected_owner:
        description: Exact owner of the already cancelled scan lease
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install database driver
        run: python -m pip install --disable-pip-version-check --no-cache-dir psycopg2-binary
      - name: Recover only the cancelled scan lease
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_OWNER: ${{ inputs.expected_owner }}
        run: python .assets/recover_cancelled_scan_lease.py
