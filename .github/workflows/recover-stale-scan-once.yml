name: Recover stale scan once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: runtime
    steps:
      - name: Install database driver
        run: python -m pip install --disable-pip-version-check --no-cache-dir psycopg2-binary
      - name: Recover only an expired stale scan marker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'], connect_timeout=20, sslmode='require')
          conn.set_session(readonly=False, autocommit=False)
          try:
              with conn:
                  with conn.cursor() as cur:
                      cur.execute("""
                          SELECT rl.owner, rl.lease_until, ss.status
                          FROM runtime_leases rl
                          JOIN system_status ss ON ss.id = 1
                          WHERE rl.lease_key = 'scheduled_scan'
                          FOR UPDATE OF rl, ss
                      """)
                      row = cur.fetchone()
                      if not row:
                          print('no_scheduled_scan_lease')
                      else:
                          owner, lease_until, status = row
                          cur.execute("""
                              SELECT (
                                  %s < now() - interval '30 minutes'
                                  AND COALESCE(%s, '') NOT IN ('IDLE', 'مستريح 💤')
                              )
                          """, (lease_until, status))
                          stale = bool(cur.fetchone()[0])
                          if not stale:
                              raise SystemExit('guard_refused_non_stale_scan')
                          cur.execute("DELETE FROM runtime_leases WHERE lease_key='scheduled_scan' AND owner=%s", (owner,))
                          if cur.rowcount != 1:
                              raise SystemExit('lease_delete_failed')
                          cur.execute("""
                              UPDATE system_status
                              SET status='IDLE',
                                  scan_phase='أُزيل قفل فحص ملغى — النظام جاهز',
                                  last_check_end=EXTRACT(EPOCH FROM now()),
                                  next_check=EXTRACT(EPOCH FROM now())
                              WHERE id=1 AND status='SCANNING'
                          """)
                          if cur.rowcount != 1:
                              raise SystemExit('status_recovery_failed')
                          print('stale_scan_recovered=true')
          finally:
              conn.close()
          PY
