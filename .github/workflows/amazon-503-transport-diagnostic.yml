name: Amazon 503 transport diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-503-transport-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: runtime
    steps:
      - name: Load context
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare isolated transport diagnosis
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/amazon-503-diagnostic"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/amazon-503-diagnostic/a.tgz" .assets/node.dat
          tar -xzf "$RUNNER_TEMP/amazon-503-diagnostic/a.tgz" -C "$RUNNER_TEMP/amazon-503-diagnostic"
          test -f "$RUNNER_TEMP/amazon-503-diagnostic/scanner.py"
          cp diagnostics/amazon_503_transport_diagnostic.py "$RUNNER_TEMP/amazon-503-diagnostic/"
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$RUNNER_TEMP/amazon-503-diagnostic/requirements.txt"

      - name: Compare HTTP transport profiles without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/amazon-503-diagnostic"
          python amazon_503_transport_diagnostic.py

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-503-transport-diagnostic-results
          path: ${{ runner.temp }}/amazon-503-diagnostic/audit_results/amazon_503_transport_diagnostic_*/results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/amazon-503-diagnostic"
