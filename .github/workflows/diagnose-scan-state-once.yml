name: Diagnose scan state once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: runtime
    steps:
      - run: python -m pip install --disable-pip-version-check --no-cache-dir psycopg2-binary
      - name: Read scan state only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, psycopg2
          c=psycopg2.connect(os.environ['DATABASE_URL'],connect_timeout=20,sslmode='require')
          with c:
            with c.cursor() as x:
              x.execute("""select rl.lease_until, rl.updated_at, ss.status, ss.last_check_start, ss.last_check_end, ss.next_check from runtime_leases rl join system_status ss on ss.id=1 where rl.lease_key='scheduled_scan'""")
              r=x.fetchone()
              if not r: print('lease=none')
              else:
                lease,updated,status,start,end,nextc=r
                x.execute("select now(), extract(epoch from now())")
                now=x.fetchone()
                print('lease_until=',lease)
                print('lease_updated_at=',updated)
                print('status=',status)
                print('last_check_start=',start)
                print('last_check_end=',end)
                print('next_check=',nextc)
                print('db_now=',now[0])
                print('db_epoch=',now[1])
          PY
