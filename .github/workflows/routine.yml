name: Routine

on:
  schedule:
    # Avoid minute zero, which is commonly delayed during high Actions load.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routine-main
  cancel-in-progress: false

jobs:
  execute:
    # The workflow intentionally has no pull_request, pull_request_target,
    # workflow_run, issue_comment, or external repository triggers.
    runs-on: ubuntu-24.04
    # ساعة واحدة هدف أداء فقط. لا نوقف Amazon عندها؛ تبقى مهلة البنية
    # التحتية واسعة لتسمح بإكمال الكتالوج عند بطء مؤقت.
    timeout-minutes: 180
    environment: runtime
    steps:
      - name: Load context
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$ARCHIVE_KEY"
          mkdir -p "$RUNNER_TEMP/.cache"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/.cache/a.tgz" .assets/node.dat
          tar -xzf "$RUNNER_TEMP/.cache/a.tgz" -C "$RUNNER_TEMP/.cache"
          test -f "$RUNNER_TEMP/.cache/scanner.py"
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$RUNNER_TEMP/.cache/requirements.txt"

      - name: Execute
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOON_LOCATION_COOKIE: ${{ secrets.NOON_LOCATION_COOKIE }}
          NOON_DISCOVERY_URLS: ${{ secrets.NOON_DISCOVERY_URLS }}
          AMAZON_NOW_ENABLED: "true"
          AMAZON_YALLA_CATEGORY_RATE: "1.5"
          AMAZON_YALLA_READ_RATE: "1.5"
          AMAZON_YALLA_READ_TIMEOUT: "8"
          # مثبتة بقياس 500 منتج: رفعها إلى 20/3.5 خفّض الكفاءة بكثرة مهلات النقل.
          AMAZON_CONCURRENCY: "12"
          AMAZON_OTHAIM_READ_RATE: "1.6"
          AMAZON_OTHAIM_READ_TIMEOUT: "6"
          AMAZON_PRIMARY_TIMEOUT_SECONDS: "6"
          AMAZON_RECOVERY_TIMEOUT_SECONDS: "6"
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/.cache"
          python scanner.py

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/.cache"
