name: Telegram Control
on:
  schedule:
    # Receives owner commands independently from the long catalog scan.
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-control-main
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    environment: runtime
    steps:
      - name: Load context
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$ARCHIVE_KEY"
          mkdir -p "$RUNNER_TEMP/.cache"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/.cache/a.tgz" .assets/node.dat
          tar -xzf "$RUNNER_TEMP/.cache/a.tgz" -C "$RUNNER_TEMP/.cache"
          test -f "$RUNNER_TEMP/.cache/control.py"
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$RUNNER_TEMP/.cache/requirements.txt"
      - name: Process Telegram commands
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOON_LOCATION_COOKIE: ${{ secrets.NOON_LOCATION_COOKIE }}
          NOON_DISCOVERY_URLS: ${{ secrets.NOON_DISCOVERY_URLS }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/.cache"
          python control.py
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/.cache"
