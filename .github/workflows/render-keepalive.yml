name: Render Keepalive

on:
  schedule:
    # Render Free spins down after 15 minutes without inbound traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Request the public health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 100 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://new-rg6l.onrender.com/
