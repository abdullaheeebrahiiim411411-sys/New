name: Amazon 503-only recovery validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-503-only-recovery-validation
  cancel-in-progress: false

jobs:
  validate-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: runtime
    steps:
      - name: Load context
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare isolated validation
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/amazon-503-only-recovery"
          printf '%s' "$ARCHIVE_KEY" | gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$RUNNER_TEMP/amazon-503-only-recovery/a.tgz" .assets/node.dat
          tar -xzf "$RUNNER_TEMP/amazon-503-only-recovery/a.tgz" -C "$RUNNER_TEMP/amazon-503-only-recovery"
          test -f "$RUNNER_TEMP/amazon-503-only-recovery/scanner.py"
          cp diagnostics/amazon_503_only_recovery_validation.py "$RUNNER_TEMP/amazon-503-only-recovery/"
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$RUNNER_TEMP/amazon-503-only-recovery/requirements.txt"

      - name: Validate technical-only recovery without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/amazon-503-only-recovery"
          python amazon_503_only_recovery_validation.py

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-503-only-recovery-validation-results
          path: ${{ runner.temp }}/amazon-503-only-recovery/audit_results/amazon_503_only_recovery_*/results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/amazon-503-only-recovery"
